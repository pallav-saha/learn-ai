<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with your Docs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #1a1a2e;
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { font-size: 20px; }
        
        .stats {
            font-size: 13px;
            opacity: 0.7;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: white;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        .sidebar h2 {
            font-size: 14px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 12px;
        }

        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 16px;
        }

        .upload-area:hover {
            border-color: #4a90d9;
            background: #f0f7ff;
        }

        .upload-area.dragover {
            border-color: #4a90d9;
            background: #e8f4ff;
        }

        .upload-area p {
            color: #666;
            font-size: 14px;
            margin-top: 8px;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .file-item .name {
            font-weight: 500;
            color: #333;
        }

        .file-item .info {
            color: #888;
            font-size: 11px;
        }

        .file-item .delete-btn {
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            font-size: 16px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .file-item .delete-btn:hover {
            background: #fee;
        }

        /* Chat area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .message {
            max-width: 75%;
            margin-bottom: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.user {
            background: #4a90d9;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .message .sources {
            font-size: 11px;
            color: #888;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #eee;
        }

        .message.bot .sources { border-top-color: #e0e0e0; }

        .welcome {
            text-align: center;
            color: #888;
            margin-top: 60px;
        }

        .welcome h2 { color: #555; margin-bottom: 8px; }

        /* Input area */
        .input-area {
            padding: 16px 24px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .input-area input:focus {
            border-color: #4a90d9;
        }

        .input-area button {
            padding: 12px 24px;
            background: #4a90d9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }

        .input-area button:hover { background: #357abd; }
        .input-area button:disabled { background: #ccc; cursor: not-allowed; }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #ddd;
            border-top-color: #4a90d9;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none; }
    </style>
</head>
<body>
    <header>
        <h1>📚 Chat with your Docs</h1>
        <span class="stats" id="stats">Loading...</span>
    </header>

    <div class="container">
        <!-- Sidebar: Upload & Files -->
        <div class="sidebar">
            <h2>Documents</h2>
            
            <div class="upload-area" id="uploadArea">
                <div>📎 Drop files here or click to upload</div>
                <p>PDF, DOCX, CSV, TXT, JSON</p>
                <input type="file" id="fileInput" accept=".pdf,.docx,.doc,.csv,.xlsx,.xls,.txt,.json" class="hidden">
            </div>

            <div class="file-list" id="fileList">
                <!-- Files appear here -->
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div class="messages" id="messages">
                <div class="welcome">
                    <h2>Ask anything about your documents</h2>
                    <p>Upload files on the left, then ask questions here.</p>
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="questionInput" placeholder="Ask a question about your documents..." 
                       onkeypress="if(event.key==='Enter')askQuestion()">
                <button onclick="askQuestion()" id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const API = '';  // Same origin
        let sessionId = 'session_' + Math.random().toString(36).substr(2, 9);

        // ============ FILE UPLOAD ============

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) uploadFile(fileInput.files[0]);
        });

        async function uploadFile(file) {
            uploadArea.innerHTML = '<div class="loading"></div><p>Uploading & indexing...</p>';
            
            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch(API + '/upload', { method: 'POST', body: formData });
                const data = await res.json();

                if (res.ok) {
                    uploadArea.innerHTML = '<div>📎 Drop files here or click to upload</div><p>PDF, DOCX, CSV, TXT, JSON</p>';
                    loadStats();
                } else {
                    uploadArea.innerHTML = `<div>❌ ${data.detail}</div><p>Try again</p>`;
                    setTimeout(() => {
                        uploadArea.innerHTML = '<div>📎 Drop files here or click to upload</div><p>PDF, DOCX, CSV, TXT, JSON</p>';
                    }, 3000);
                }
            } catch (err) {
                uploadArea.innerHTML = `<div>❌ Upload failed</div><p>${err.message}</p>`;
            }
        }

        // ============ STATS & FILE LIST ============

        async function loadStats() {
            try {
                const res = await fetch(API + '/stats');
                const data = await res.json();

                document.getElementById('stats').textContent = 
                    `${data.total_documents} docs | ${data.total_chunks} chunks`;

                const fileList = document.getElementById('fileList');
                fileList.innerHTML = data.uploaded_files.map(f => `
                    <div class="file-item">
                        <div>
                            <div class="name">${f}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteFile('${f}')" title="Delete">×</button>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('stats').textContent = 'Error loading stats';
            }
        }

        async function deleteFile(filename) {
            if (!confirm(`Delete ${filename}?`)) return;
            await fetch(API + `/documents/${filename}`, { method: 'DELETE' });
            loadStats();
        }

        // ============ CHAT ============

        async function askQuestion() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            if (!question) return;

            input.value = '';
            addMessage(question, 'user');

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.textContent = '...';

            try {
                const res = await fetch(API + '/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, session_id: sessionId }),
                });

                const data = await res.json();

                if (res.ok) {
                    addMessage(data.answer, 'bot', data.sources);
                } else {
                    addMessage(`Error: ${data.detail}`, 'bot');
                }
            } catch (err) {
                addMessage(`Error: ${err.message}`, 'bot');
            }

            sendBtn.disabled = false;
            sendBtn.textContent = 'Send';
        }

        function addMessage(text, type, sources = []) {
            const messages = document.getElementById('messages');
            
            // Remove welcome message
            const welcome = messages.querySelector('.welcome');
            if (welcome) welcome.remove();

            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = text;

            if (sources.length > 0) {
                const srcDiv = document.createElement('div');
                srcDiv.className = 'sources';
                srcDiv.textContent = `Sources: ${sources.join(', ')}`;
                div.appendChild(srcDiv);
            }

            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        // Load stats on page load
        loadStats();
    </script>
</body>
</html>
