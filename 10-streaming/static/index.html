<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #e0e0e0;
        }

        header {
            background: #16213e;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a4a;
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            background: #2d5a3d;
            color: #6fcf97;
        }

        .status.disconnected {
            background: #5a2d2d;
            color: #cf6f6f;
        }

        .clear-btn {
            background: none;
            border: 1px solid #444;
            color: #aaa;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .clear-btn:hover { border-color: #888; color: #fff; }

        /* Messages */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user {
            background: #4a90d9;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            background: #2a2a4a;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.assistant .cursor {
            display: inline-block;
            width: 2px;
            height: 16px;
            background: #4a90d9;
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .message.error {
            background: #3d2020;
            color: #ff8888;
            align-self: center;
            font-size: 13px;
        }

        .welcome {
            text-align: center;
            color: #666;
            margin: auto;
            padding: 40px;
        }

        .welcome h2 {
            color: #888;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .welcome p { font-size: 14px; }

        /* Code blocks in responses */
        .message code {
            background: #1a1a2e;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 13px;
        }

        .message pre {
            background: #1a1a2e;
            padding: 12px;
            border-radius: 6px;
            margin: 8px 0;
            overflow-x: auto;
        }

        .message pre code {
            background: none;
            padding: 0;
        }

        /* Input area */
        .input-area {
            padding: 16px 24px;
            background: #16213e;
            border-top: 1px solid #2a2a4a;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-area textarea {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #333;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            background: #1a1a2e;
            color: #e0e0e0;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 150px;
            line-height: 1.4;
        }

        .input-area textarea:focus { border-color: #4a90d9; }

        .input-area textarea::placeholder { color: #555; }

        .send-btn {
            padding: 12px 20px;
            background: #4a90d9;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            min-width: 70px;
            height: 44px;
        }

        .send-btn:hover { background: #357abd; }
        .send-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

        .stop-btn {
            padding: 12px 20px;
            background: #d94a4a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            min-width: 70px;
            height: 44px;
        }

        .stop-btn:hover { background: #bd3737; }

        .hidden { display: none; }

        /* Scrollbar */
        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    </style>
</head>
<body>
    <header>
        <h1>Streaming Chat</h1>
        <div class="header-actions">
            <span class="status" id="status">Connected</span>
            <button class="clear-btn" onclick="clearChat()">Clear Chat</button>
        </div>
    </header>

    <div class="messages" id="messages">
        <div class="welcome" id="welcome">
            <h2>WebSocket Streaming Chat</h2>
            <p>Tokens appear in real-time as the LLM generates them.<br>
            Try asking a question below.</p>
        </div>
    </div>

    <div class="input-area">
        <textarea id="input" placeholder="Type a message... (Enter to send, Shift+Enter for new line)"
                  rows="1"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
        <button class="stop-btn hidden" id="stopBtn" onclick="stopGeneration()">Stop</button>
    </div>

    <script>
    // ============================================================
    // WEBSOCKET CONNECTION
    // ============================================================
    
    let ws = null;
    let isGenerating = false;
    let currentBotMessage = null;

    function connect() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${window.location.host}/ws/chat`);

        ws.onopen = () => {
            document.getElementById('status').textContent = 'Connected';
            document.getElementById('status').className = 'status';
        };

        ws.onclose = () => {
            document.getElementById('status').textContent = 'Disconnected';
            document.getElementById('status').className = 'status disconnected';
            // Auto-reconnect after 2 seconds
            setTimeout(connect, 2000);
        };

        ws.onerror = () => {
            document.getElementById('status').textContent = 'Error';
            document.getElementById('status').className = 'status disconnected';
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            handleServerMessage(data);
        };
    }

    // ============================================================
    // HANDLE SERVER MESSAGES
    // ============================================================

    function handleServerMessage(data) {
        switch (data.type) {
            case 'token':
                // Append token to current bot message
                if (!currentBotMessage) {
                    currentBotMessage = addMessage('', 'assistant');
                }
                appendToMessage(currentBotMessage, data.content);
                break;

            case 'done':
                // Generation complete — remove cursor, reset state
                if (currentBotMessage) {
                    removeCursor(currentBotMessage);
                }
                currentBotMessage = null;
                setGenerating(false);
                break;

            case 'error':
                addMessage(data.content, 'error');
                currentBotMessage = null;
                setGenerating(false);
                break;

            case 'cleared':
                document.getElementById('messages').innerHTML = '';
                document.getElementById('welcome').style.display = '';
                currentBotMessage = null;
                setGenerating(false);
                break;
        }
    }

    // ============================================================
    // SEND MESSAGES
    // ============================================================

    function sendMessage() {
        const input = document.getElementById('input');
        const message = input.value.trim();
        if (!message || isGenerating || !ws || ws.readyState !== WebSocket.OPEN) return;

        // Remove welcome screen
        const welcome = document.getElementById('welcome');
        if (welcome) welcome.style.display = 'none';

        // Show user message
        addMessage(message, 'user');
        input.value = '';
        autoResize(input);

        // Send to server
        ws.send(JSON.stringify({ type: 'message', content: message }));
        setGenerating(true);
    }

    function stopGeneration() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'stop' }));
        }
        if (currentBotMessage) {
            removeCursor(currentBotMessage);
        }
        currentBotMessage = null;
        setGenerating(false);
    }

    function clearChat() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'clear' }));
        }
    }

    // ============================================================
    // UI HELPERS
    // ============================================================

    function addMessage(text, type) {
        const messages = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = `message ${type}`;

        if (type === 'assistant') {
            // Start with cursor (typing indicator)
            div.innerHTML = `<span class="text"></span><span class="cursor"></span>`;
        } else {
            div.textContent = text;
        }

        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        return div;
    }

    function appendToMessage(messageEl, token) {
        const textSpan = messageEl.querySelector('.text');
        if (textSpan) {
            textSpan.textContent += token;
        } else {
            messageEl.textContent += token;
        }
        // Auto-scroll
        const messages = document.getElementById('messages');
        messages.scrollTop = messages.scrollHeight;
    }

    function removeCursor(messageEl) {
        const cursor = messageEl.querySelector('.cursor');
        if (cursor) cursor.remove();
    }

    function setGenerating(value) {
        isGenerating = value;
        document.getElementById('sendBtn').classList.toggle('hidden', value);
        document.getElementById('stopBtn').classList.toggle('hidden', !value);
        document.getElementById('input').disabled = value;
        if (!value) {
            document.getElementById('input').focus();
        }
    }

    // ============================================================
    // INPUT HANDLING
    // ============================================================

    const input = document.getElementById('input');

    // Auto-resize textarea
    input.addEventListener('input', () => autoResize(input));

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 150) + 'px';
    }

    // Enter to send, Shift+Enter for new line
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // ============================================================
    // INIT
    // ============================================================
    
    connect();
    input.focus();
    </script>
</body>
</html>
