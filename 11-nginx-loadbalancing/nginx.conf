# ============================================================
# Nginx config for load balancing 3 FastAPI copies
# ============================================================
#
# This tells Nginx:
#   1. There are 3 backend servers (8001, 8002, 8003)
#   2. Listen on port 8080 and spread requests across them
#
# Run with:
#   nginx -c /full/path/to/this/nginx.conf
#
# NOTE: Use the ABSOLUTE path when running (nginx needs the full path).

# Run in foreground so you can see logs and stop with Ctrl+C
daemon off;

# How many worker processes (1 is fine for a demo)
worker_processes 1;

events {
    worker_connections 1024;  # Max connections per worker
}

http {
    # ========================================================
    # DEFINE THE BACKEND POOL (the 3 copies of your app)
    # ========================================================
    # "upstream" = a group of servers Nginx can distribute to.
    # By default, Nginx uses ROUND ROBIN (server 1, then 2, then 3, repeat).
    upstream fastapi_backend {
        # Load balancing method (uncomment ONE to try different strategies):

        # Algorithm	What it does
        # round_robin (default)	Rotate through tasks in order (merry-go-round)
        #least_conn=  means --least_outstanding_requests (LOR)	Send to the task with the fewest in-flight requests

        # Default: round robin (rotate through servers evenly)
        server 127.0.0.1:8001;
        server 127.0.0.1:8002;
        server 127.0.0.1:8003;

        # Alternative: least_conn (send to server with fewest active connections)
        least_conn;

        # Alternative: ip_hash (same client always hits same server - "sticky")
        # ip_hash;
    }

    # ========================================================
    # THE PROXY SERVER (what the browser connects to)
    # ========================================================
    server {
        listen 8080;  # Browser connects here: http://localhost:8080

        location / {
            # Forward requests to the backend pool defined above
            proxy_pass http://fastapi_backend;

            # Pass along useful headers so the app knows the real client
            # Forward the original Host header to the backend. Without this, the backend would see the proxy's host, not the real one. $host is an Nginx variable holding the original hostname.
            # Tell the backend the client's real IP address ($remote_addr). Otherwise the backend only sees Nginx's IP. Useful for logging, rate limiting, etc.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # For streaming apps (SSE/WebSocket), disable buffering:
            # The important one for streaming. Remember the "server-side buffering breaks streaming" problem? This turns off Nginx's buffering so tokens flow straight through to the browser instead of being collected and sent all at once.
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
