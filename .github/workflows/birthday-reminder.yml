name: Birthday Reminder Bot

on:
  schedule:
    # Run daily at 6:00 AM IST (00:30 UTC, since IST = UTC+5:30)
    - cron: '30 0 * * *'
    # Run on the 1st of every month at 6:00 AM IST
    # (The daily job handles this too, but this is explicit)

  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (monthly or daily)'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - monthly

jobs:
  send-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run monthly summary (1st of month)
        if: github.event.inputs.mode == 'monthly' || (github.event_name == 'schedule' && (github.event.schedule == '30 0 1 * *' || ''))
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          TODAY=$(date -u +%d)
          if [ "$TODAY" = "01" ] || [ "${{ github.event.inputs.mode }}" = "monthly" ]; then
            python birthday-bot/birthday_reminder.py monthly
          fi

      - name: Run daily birthday check
        if: github.event.inputs.mode == 'daily' || github.event_name == 'schedule'
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python birthday-bot/birthday_reminder.py daily
